# ============================================================================
# Configuración de Air - Hot Reload para Go
# ============================================================================
# Air es una herramienta de recarga en vivo para aplicaciones Go.
# Monitorea cambios en archivos y recompila automáticamente el proyecto.

# ============================================================================
# CONFIGURACIÓN GENERAL
# ============================================================================

root = "."
tmp_dir = "tmp"

# ============================================================================
# CONFIGURACIÓN DE BUILD
# ============================================================================

[build]

# ----------------------------------------------------------------------------
# Comando de compilación
# ----------------------------------------------------------------------------
# Este comando se ejecuta ante cualquier cambio detectado.
# 
# Requisitos previos:
#   - chmod +x resources/scripts/recompile.sh
#   - chmod +x resources/scripts/sqlc/runSQLC.sh
#   - chmod +x resources/scripts/templ/runTEMPL.sh
cmd = "./resources/scripts/recompile.sh"

# Ubicación del binario compilado
bin = "tmp/main"

# ----------------------------------------------------------------------------
# Archivos y directorios a monitorear
# ----------------------------------------------------------------------------

# Extensiones de archivo que disparan la recompilación
include_ext = ["go", "templ", "temp", "html", "css", "png", "svg", "sql", "js"]

# Directorios a incluir en el monitoreo
include_dir = ["static", "database", "app"]

# Archivos específicos a incluir (vacío por defecto)
include_file = []

# ----------------------------------------------------------------------------
# Archivos y directorios a excluir
# ----------------------------------------------------------------------------

# Directorios excluidos del monitoreo
# IMPORTANTE: 'app/database' debe estar excluido para evitar ciclos infinitos
# al ejecutar SQLC, ya que genera archivos .go en ese directorio.
exclude_dir = ["assets", "tmp", "vendor", "resources", "app/database"]

# Archivos específicos a excluir (vacío por defecto)
exclude_file = []

# Patrones regex para excluir archivos
# - "_test.go": Excluye archivos de prueba
# - "app/views/.*\\.go$": Excluye TODOS los archivos .go dentro de app/views
#   IMPORTANTE: Sin esta regla se entra en un bucle infinito cuando se 
#   ejecuta 'templ generate', ya que Templ genera archivos .go en ese directorio.
exclude_regex = ["_test.go", "app/views/.*\\.go$"]

# ----------------------------------------------------------------------------
# Opciones de monitoreo
# ----------------------------------------------------------------------------

# Si es true, solo recompila cuando el contenido del archivo cambia
exclude_unchanged = false

# Seguir enlaces simbólicos
follow_symlink = false

# Archivo de log para Air
log = "air.log"

# Usar polling en lugar de eventos del sistema de archivos
poll = false

# Intervalo de polling en milisegundos (solo si poll = true)
poll_interval = 500

# ----------------------------------------------------------------------------
# Manejo de errores y procesos
# ----------------------------------------------------------------------------

# Detener la ejecución si hay errores de compilación
stop_on_error = false

# Enviar señal de interrupción (SIGINT) al proceso antes de matarlo
send_interrupt = false

# Retraso en milisegundos antes de matar el proceso anterior
kill_delay = 500

# ============================================================================
# CONFIGURACIÓN DE LOGS
# ============================================================================

[log]

# Mostrar timestamp en los logs
time = true

# ============================================================================
# CONFIGURACIÓN DE COLORES
# ============================================================================

[color]

# Personalización de colores para cada componente de Air.
# Si no se proporciona un valor, se usa el color por defecto.
main = "magenta"     # Color para mensajes principales
watcher = "cyan"     # Color para el observador de archivos
build = "yellow"     # Color para el proceso de compilación
runner = "green"     # Color para la ejecución del binario

# ============================================================================
# CONFIGURACIÓN MISCELÁNEA
# ============================================================================

[misc]

# Eliminar directorio temporal al salir de Air
clean_on_exit = true