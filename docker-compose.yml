# ------------------------------------------------------------------------------------------------
# Services
# ------------------------------------------------------------------------------------------------

services:
  app:
    build:
      context: .
      target: production
    container_name: scifi
    ports:
      - "${APP_PORT}:${APP_PORT}"
    depends_on:
      db:
        condition: service_healthy
      supertokens:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      mailhog:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: "${DB_URL}"
      MEILI_URL: "${MEILI_URL}"
      MEILI_MASTER_KEY: "${MEILI_KEY}"
      SUPERTOKENS_URL: "${SUPERTOKENS_URL}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: "${DB_NAME}"
      MINIO_HOST: "${MINIO_HOST}"
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
      MINIO_BUCKET: "${MINIO_BUCKET}"
    env_file:
      - .env
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ------------------------------------------------------------------------------------------------

  db:
    image: postgres:15
    container_name: database
    environment:
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_NAME}"
      APP_ENV: "production"
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -p ${DB_PORT}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------------------------------------
  meilisearch:
    image: getmeili/meilisearch:v1.31.0
    container_name: meilisearch
    ports:
      - "${MEILI_PORT}:${MEILI_PORT}"
    volumes:
      - meili-data:/meili_data
    environment:
      MEILI_MASTER_KEY: "${MEILI_KEY}"
      MEILI_LOG_LEVEL: "WARN" # Logs reductions: OFF, ERROR, WARN, INFO, DEBUG, TRACE
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "-sf"
        - "http://localhost:${MEILI_PORT}/health"
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ------------------------------------------------------------------------------------------------

  supertokens:
    image: supertokens/supertokens-core:dev-branch-11.0
    container_name: supertokens
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRESQL_CONNECTION_URI: "${DB_URL}"
      SUPERTOKENS_LOG_LEVEL: "error"
    ports:
      - "${SUPERTOKENS_PORT}:${SUPERTOKENS_PORT}"
    volumes:
      - ./resources/scripts/healthchecks/supertokens.sh:/healthcheck.sh:ro
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "/healthcheck.sh"
        - "${SUPERTOKENS_PORT}"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s # So the database has time to be initialized.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ------------------------------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: minio
    command: server /data --console-address ":9001" --quiet
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - "CMD"
        - "mc"
        - "ready"
        - "local"
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ------------------------------------------------------------------------------------------------

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "-qO-"
        - "http://127.0.0.1:8025"
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ------------------------------------------------------------------------------------------------
  loki:
    image: grafana/loki:2.9.4
    container_name: loki
    command: -config.file=/etc/loki/config.yaml
    ports:
      - "${LOKI_PORT}:3100"
    volumes:
      - loki-data:/loki
      - ./observability/loki/loki-config.yaml:/etc/loki/config.yaml
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ------------------------------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./observability/promtail/promtail.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ------------------------------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources
    environment:
      GF_SECURITY_ADMIN_USER: "${GF_SECURITY_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD}"
      GF_LOG_LEVEL: error # debug, info, warn, error, critical...
    depends_on:
      - loki
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# ------------------------------------------------------------------------------------------------
# Volumes
# ------------------------------------------------------------------------------------------------

volumes:
  postgres-data:
  meili-data:
  minio-data:
  loki-data:
  grafana-data:
# ------------------------------------------------------------------------------------------------
